services:
  napcat:
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    ports:
      - 6099:6099
    container_name: napcat
    restart: unless-stopped
    image: mlikiowa/napcat-docker:latest
    volumes:
      - ./data:/AstrBot/data
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - astrbot_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:6099/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  astrbot:
    environment:
      - TZ=Asia/Shanghai
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    ports:
      - "6185:6185"
    volumes:
      - ./data:/AstrBot/data
    networks:
      - astrbot_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:6185/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  gsuid-core:
    image: docker.cnb.cool/gscore-mirror/gsuid_core:latest
    restart: unless-stopped
    container_name: gsuid-core
    volumes:
      - ./gsuid_core:/gsuid_core
      - ./gsuid_data:/gsuid_core/data
      - ./gsuid_start/gsuid_start.sh:/start
      - ./gsuid_plugins:/gsuid_core/gsuid_core/plugins
    ports:
      - 8765:8765
    environment:
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      HOME: /app/data
    networks:
      - astrbot_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8765/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  astrbot_network:
    driver: bridge
